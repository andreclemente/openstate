name: Sync issues to observations

on:
  issues:
    types: [opened, reopened, labeled]
  workflow_dispatch:

permissions:
  contents: write
  issues: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync observations from issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          # Fetch all open issues with draft/confirmed labels
          gh issue list --repo ${{ github.repository }} --label draft --label confirmed --state open --json number,title,body,labels,createdAt \
            | python3 -c "
          import json, sys, re, os

          data = json.load(sys.stdin)

          for issue in data:
              num = issue['number']
              title = issue['title']
              body = issue.get('body', '')
              created = issue['createdAt'][:10]

              # Determine status from labels
              labels = [l['name'] for l in issue.get('labels', [])]
              status = 'confirmed' if 'confirmed' in labels else 'draft'

              # Parse body fields
              what_happens = ''
              affected = ''
              impact = ''
              evidence = ''
              root_cause = ''

              # Extract fields from the issue template structure
              # The template uses markdown headers like "## Observação", "## O que acontece", etc.

              # Map PT/EN headers
              sections = {
                  'observacao': '',
                  'observation': '',
                  'o que acontece': '',
                  'what happens': '',
                  'what happens': '',
                  'quem é afetado': '',
                  'who is affected': '',
                  'impacto': '',
                  'impact': '',
                  'evidência': '',
                  'evidence': '',
                  'causa raiz': '',
                  'root cause': '',
              }

              # Simple section extraction
              current_section = None
              for line in body.split('\n'):
                  stripped = line.strip()
                  if stripped.startswith('## '):
                      section_name = stripped.replace('## ', '').strip().lower()
                      # Map to keys
                      for key in sections:
                          if key in section_name:
                              current_section = key
                              break
                      else:
                          current_section = None
                  elif current_section and stripped:
                      prefix = ''
                      if stripped.startswith('- '):
                          prefix = '- '
                          stripped_text = stripped[2:]
                      elif stripped.startswith('1. ') or stripped.startswith('2. ') or stripped.startswith('3. '):
                          prefix = stripped[0] + '. '
                          stripped_text = stripped[3:]
                      else:
                          stripped_text = stripped

                      key = current_section
                      if key == 'evidência' or key == 'evidence':
                          evidence += prefix + stripped_text + '\n'
                      elif key == 'causa raiz' or key == 'root cause':
                          root_cause += prefix + stripped_text + '\n'
                      elif key == 'o que acontece' or key == 'what happens':
                          what_happens += prefix + stripped_text + '\n'
                      elif key == 'quem é afetado' or key == 'who is affected':
                          affected += prefix + stripped_text + '\n'
                      elif key == 'impacto' or key == 'impact':
                          impact += prefix + stripped_text + '\n'

              # Clean title (remove [Observação] prefix)
              clean_title = re.sub(r'^\[Observação\]\s*', '', title).strip()
              clean_title = re.sub(r'^\[Observation\]\s*', '', clean_title).strip()

              # Count evidence lines
              evidence_lines = [l for l in evidence.split('\n') if l.strip()]
              source_count = len(evidence_lines)

              # Determine area from body
              area = 'Outro'
              area_match = re.search(r'Sistema envolvido[^:]*:\s*\*{0,2}([^*\n]+?)\*{0,2}', body, re.IGNORECASE)
              if area_match:
                  area_text = area_match.group(1).strip()
                  # Split on / and take Portuguese part
                  if '/' in area_text:
                      area = area_text.split('/')[0].strip()
                  else:
                      area = area_text

              slug = 'issue-' + str(num)

              # Build markdown
              content_parts = []
              if what_happens:
                  content_parts.append(what_happens.strip())
              if affected:
                  content_parts.append('')
                  content_parts.append('## ' + ('Quem é afetado' if 'pt' in body.lower() else 'Who is affected'))
                  content_parts.append(affected.strip())
              if impact:
                  content_parts.append('')
                  content_parts.append('## ' + ('Impacto' if 'pt' in body.lower() else 'Impact'))
                  content_parts.append(impact.strip())
              if evidence:
                  content_parts.append('')
                  content_parts.append('## ' + ('Evidência' if 'pt' in body.lower() else 'Evidence'))
                  content_parts.append(evidence.strip())
              if root_cause:
                  content_parts.append('')
                  content_parts.append('## ' + ('Causa raiz possível' if 'pt' in body.lower() else 'Possible root cause'))
                  content_parts.append(root_cause.strip())

              content_body = '\n'.join(content_parts) if content_parts else body

              md = f'''---
title: {clean_title}
area: {area}
status: {status}
date: {created}
sources: {source_count}
github_issue: {num}
layout: observation
slug: {slug}
---

{content_body}
'''

              filepath = f'docs/_observations/{slug}.md'

              # Check if file already exists with same content
              if os.path.exists(filepath):
                  with open(filepath) as f:
                      existing = f.read()
                  if existing.strip() == md.strip():
                      print(f'Issue #{num}: unchanged, skipping')
                      continue

              with open(filepath, 'w') as f:
                  f.write(md)
              print(f'Issue #{num}: wrote {filepath}')

          " > /tmp/sync_output.txt

          cat /tmp/sync_output.txt

          # Commit if there are changes
          cd docs
          if ! git diff --quiet; then
            git config user.name 'openstate-bot'
            git config user.email 'bot@openstate.andreclemente.dev'
            git add -A
            git commit -m 'auto-sync: update observations from issues'
            git push
            echo 'Changes committed and pushed'
          else
            echo 'No changes'
          fi
