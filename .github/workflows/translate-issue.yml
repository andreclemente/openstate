name: "Auto-translate issue to English"

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect language and translate
        id: translate
        uses: actions/github-script@v7
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        with:
          script: |
            const issue = context.payload.issue;
            const body = issue.body || '';
            const title = issue.title || '';
            const fullText = title + ' ' + body;

            // Skip if already has translated label
            const existingLabels = issue.labels.map(l => l.name);
            if (existingLabels.includes('translated')) {
              console.log('Already translated. Skipping.');
              return;
            }

            // Simple heuristic: check for common Portuguese words
            const ptWords = ['o', 'a', 'os', 'as', 'um', 'uma', 'de', 'do', 'da', 'dos', 'das', 'em', 'no', 'na', 'nos', 'nas', 'por', 'para', 'com', 'sem', 'que', 'se', 'é', 'foi', 'está', 'tem', 'são', 'mais', 'muito', 'como', 'mas', 'ou', 'quando', 'onde', 'porque', 'também', 'já', 'ainda', 'depois', 'antes', 'entre', 'sobre', 'até', 'desde', 'durante', 'apenas', 'mesmo', 'outro', 'outra', 'cada', 'todo', 'toda', 'não', 'sim', 'aqui', 'agora', 'hoje', 'sempre', 'nunca', 'bem', 'mal', 'melhor', 'pior', 'maior', 'menor', 'grande', 'pequeno', 'novo', 'velho', 'bom', 'mau', 'primeiro', 'último', 'geral', 'possível', 'diferente', 'importante', 'necessário', 'capaz', 'difícil', 'fácil', 'simples', 'complexo', 'claro', 'certo', 'errado', 'real', 'público', 'privado', 'interno', 'externo', 'local', 'nacional', 'moderno', 'antigo', 'atual', 'passado', 'futuro', 'presente', 'disponível', 'acessível', 'gratuito', 'pago', 'obrigatório', 'opcional', 'natural', 'humano', 'digital', 'físico', 'temporal', 'permanente', 'definitivo', 'parcial', 'total', 'completo', 'positivo', 'negativo', 'neutro', 'objetivo', 'concreto', 'prático', 'profissional', 'pessoal', 'social', 'económico', 'cultural', 'ambiental', 'tecnológico', 'científico', 'médico', 'jurídico', 'administrativo', 'comercial', 'industrial', 'educativo', 'hospitalar', 'escolar', 'judicial', 'governamental', 'estatal', 'municipal', 'familiar', 'individual', 'coletivo', 'financeiro', 'transporte', 'comunicação', 'programação', 'desenvolvimento', 'produção', 'distribuição', 'consumo', 'venda', 'compra', 'sistema', 'plataforma', 'portal', 'site', 'aplicação', 'software', 'dados', 'servidor', 'cliente', 'utilizador', 'administrador', 'gestor', 'responsável', 'técnico', 'especialista', 'professor', 'aluno', 'estudante', 'participante', 'membro', 'colaborador', 'parceiro', 'fornecedor', 'consumidor', 'utente', 'cidadão', 'habitante', 'residente', 'visitante', 'turista', 'empregado', 'trabalhador', 'empresário', 'investidor', 'p