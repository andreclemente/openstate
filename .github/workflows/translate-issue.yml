o', 'oneroso', 'dispendioso', 'económico', 'barato', 'caro', 'acessível', 'inacessível', 'disponível', 'indisponível', 'obtenível', 'atingível', 'alcançável', 'inatingível', 'realizatingível', 'exequível', 'inexequível', 'viável', 'inviável', 'praticável', 'impraticável', 'funcional', 'disfuncional', 'operacional', 'inoperacional', 'ativo', 'inativo', 'ligado', 'desligado', 'aberto', 'fechado', 'público', 'privado', 'interno', 'externo', 'nacional', 'internacional', 'local', 'global', 'geral', 'específico', 'particular', 'universal', 'individual', 'coletivo', 'comum', 'pessoal', 'próprio', 'alheio', 'estranho', 'familiar', 'desconhecido', 'conhecido', 'reconhecido', 'identificado', 'classificado', 'categorizado', 'organizado', 'estruturado', 'sistematizado', 'metodológico', 'metódico', 'sistemático', 'organizado', 'ordenado', 'arrumado', 'limpo', 'arrumado', 'desordenado', 'caótico', 'confuso', 'claro', 'óbvio', 'evidente', 'manifesto', 'patente', 'notório', 'público', 'conhecido', 'famoso', 'célebre', 'renomado', 'prestigiado', 'respeitado', 'valorizado', 'apreciado', 'reconhecido', 'admitido', 'aceito', 'aprovado', 'validado', 'confirmado', 'verificado', 'comprovado', 'demonstrado', 'provado', 'atestado', 'certificado', 'garantido', 'assegurado', 'protegido', 'defendido', 'salvaguardado', 'preservado', 'conservado', 'mantido', 'sustentado', 'suportado', 'tolerado', 'suportado', 'aguentado', 'resistido', 'enfrentado', 'confrontado', 'combatido', 'lutado', 'batalhado', 'guerreado', 'competido', 'concorrido', 'rivalizado', 'comparado', 'contrastado', 'diferenciado', 'distinto', 'distinguido', 'destacado', 'saliente', 'notável', 'significativo', 'relevante', 'importante', 'fundamental', 'essencial', 'primordial', 'básico', 'elementar', 'primário', 'secundário', 'terciário', 'quaternário', 'quinário', 'senário', 'septenário', 'octonário', 'nonário', 'denário'];

            const words = fullText.toLowerCase().split(/\s+/).filter(w => w.length > 1);
            const ptCount = words.filter(w => ptWords.includes(w)).length;
            const ptRatio = words.length > 0 ? ptCount / words.length : 0;

            // Lower threshold: 2% Portuguese words triggers translation
            const needsTranslation = ptRatio > 0.02;

            if (!needsTranslation) {
              console.log(`Issue appears to be in English (ptRatio: ${ptRatio.toFixed(3)}). Skipping translation.`);
              return;
            }

            console.log(`Detected Portuguese content (ptRatio: ${ptRatio.toFixed(3)}). Translating...`);

            const translatePrompt = [
              'Translate the following GitHub issue from Portuguese to English.',
              'Keep the exact same structure, formatting, and markdown.',
              'Only translate the text content, not code, URLs, or proper nouns.',
              '',
              'Title: ' + title,
              '',
              'Body:',
              body,
              '',
              'Provide the translation in this exact format:',
              '---TITLE---',
              '[translated title]',
              '---BODY---',
              '[translated body]'
            ].join('\n');

            const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + process.env.OPENROUTER_API_KEY,
                'HTTP-Referer': 'https://github.com/andreclemente/openstate',
                'X-Title': 'OpenState Auto-Translate'
              },
              body: JSON.stringify({
                model: 'google/gemini-2.0-flash-001',
                messages: [
                  { role: 'system', content: 'You are a professional translator. Translate Portuguese to English accurately while preserving markdown structure, formatting, and technical terms.' },
                  { role: 'user', content: translatePrompt }
                ],
                temperature: 0.3,
                max_tokens: 4000
              })
            });

            if (!response.ok) {
              const errText = await response.text();
              console.error('Translation API error:', response.status, errText);
              return;
            }

            const data = await response.json();
            const translation = data.choices[0]?.message?.content;

            if (!translation) {
              console.error('Empty translation response');
              return;
            }

            const titleMatch = translation.match(/---TITLE---\n([\s\S]*?)\n---BODY---/);
            const bodyMatch = translation.match(/---BODY---\n([\s\S]*)/);

            if (!titleMatch || !bodyMatch) {
              console.error('Failed to parse translation response');
              return;
            }

            const translatedTitle = titleMatch[1].trim();
            const translatedBody = bodyMatch[1].trim();

            const commentLines = [
              '## 🇬🇧 English Translation',
              '',
              '> This issue was written in Portuguese. Below is an automatic translation for English-speaking readers.',
              '',
              '### ' + translatedTitle,
              '',
              translatedBody,
              '',
              '---',
              '',
              '*This translation was auto-generated. The original issue above is the authoritative version.*'
            ];

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: commentLines.join('\n')
            });

            console.log('Translation posted successfully.');
