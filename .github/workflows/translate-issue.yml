name: "Auto-translate issue to English"

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect language and translate
        id: translate
        uses: actions/github-script@v7
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        with:
          script: |
            const issue = context.payload.issue;
            const body = issue.body || '';
            const title = issue.title || '';

            // Simple heuristic: check if body contains common Portuguese words
            const ptPattern = /\b(o|a|os|as|um|uma|de|do|da|dos|das|em|no|na|nos|nas|por|para|com|sem|que|se|é|foi|está|tem|são|mais|muito|como|mas|ou|quando|onde|porque|também|já|ainda|depois|antes|entre|sobre|até|desde|durante|apenas|mesmo|outro|outra|cada|todo|toda|não|sim|aqui|agora|hoje|sempre|nunca|bem|mal|melhor|pior|maior|menor|grande|pequeno|novo|velho|bom|mau|primeiro|último|geral|possível|diferente|importante|necessário|capaz|difícil|fácil|simples|complexo|claro|certo|errado|real|maioria|parte|igual|contrário|direito|público|privado|interno|externo|local|nacional|moderno|antigo|atual|passado|futuro|presente|disponível|acessível|gratuito|pago|obrigatório|opcional|natural|humano|mecânico|eletrónico|digital|físico|virtual|temporal|permanente|definitivo|parcial|total|completo|absoluto|relativo|positivo|negativo|neutro|objetivo|subjetivo|concreto|abstrato|teórico|prático|profissional|pessoal|social|económico|cultural|ambiental|tecnológico|científico|médico|jurídico|administrativo|comercial|industrial|agrícola|turístico|educativo|hospitalar|escolar|judicial|eleitoral|governamental|estatal|municipal|familiar|individual|coletivo|financeiro|bancário|transporte|comunicação|informática|programação|desenvolvimento|produção|distribuição|consumo|venda|compra|sistema|plataforma|portal|site|aplicação|software|dados|servidor|cliente|utilizador|administrador|gestor|responsável|técnico|especialista|professor|aluno|estudante|participante|membro|colaborador|parceiro|fornecedor|consumidor|utente|cidadão|habitante|residente|visitante|turista|empregado|trabalhador|empresário|investidor|proprietário|comprador|vendedor|juiz|advogado|agente|funcionário|autoridade|governo|ministro|deputado|presidente|relatório|documento|registo|base|rede|imagem|vídeo|notícia|jornal|revista|rádio|televisão|imprensa|media|segurança|proteção|defesa|vigilância|controlo|regulação|fiscalização|inspeção|auditoria|avaliação|análise|investigação|pesquisa|estudo|programa|plano|projeto|proposta|orçamento|receita|despesa|custo|preço|valor|taxa|imposto|tarifa|multa|juros|lucro|investimento|empréstimo|crédito|dívida|capital|ativo|passivo|resultado|anual|mensal|diário|horário|temporário|permanente|breve|longo|rápido|lento|estável|instável|constante|variável|fixo|móvel|completo|parcial|total|absoluto|relativo|positivo|negativo|neutro|objetivo|subjetivo|concreto|abstrato|teórico|prático|profissional|pessoal|social|económico|cultural|ambiental|tecnológico|científico|médico|jurídico|administrativo|comercial|industrial|agrícola|turístico|educativo|hospitalar|escolar|judicial|eleitoral|governamental|estatal|municipal|familiar|individual|coletivo|financeiro|bancário|transporte|comunicação|informática|programação|desenvolvimento|produção|distribuição|consumo|venda|compra|sistema|plataforma|portal|site|aplicação|software|dados|servidor|cliente|utilizador|administrador|gestor|responsável|técnico|especialista|professor|aluno|estudante|participante|membro|colaborador|parceiro|fornecedor|consumidor|utente|cidadão|habitante|residente|visitante|turista|empregado|trabalhador|empresário|investidor|proprietário|comprador|vendedor|juiz|advogado|agente|funcionário|autoridade|governo|ministro|deputado|presidente)\b/gi;

            const fullText = title + ' ' + body;
            const ptMatches = fullText.match(ptPattern);
            const wordCount = fullText.split(/\s+/).length;
            const ptRatio = ptMatches ? ptMatches.length / wordCount : 0;

            // If more than 3% Portuguese words, consider it non-English
            const needsTranslation = ptRatio > 0.03;

            if (!needsTranslation) {
              console.log('Issue appears to be in English. Skipping translation.');
              return;
            }

            console.log('Detected non-English content. Translating...');

            // Build the translation prompt
            const translatePrompt = [
              'Translate the following GitHub issue from Portuguese to English.',
              'Keep the exact same structure, formatting, and markdown.',
              'Only translate the text content, not code, URLs, or proper nouns.',
              '',
              'Title: ' + title,
              '',
              'Body:',
              body,
              '',
              'Provide the translation in this exact format:',
              '---TITLE---',
              '[translated title]',
              '---BODY---',
              '[translated body]'
            ].join('\n');

            // Call OpenRouter API for translation
            const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + process.env.OPENROUTER_API_KEY,
                'HTTP-Referer': 'https://github.com/andreclemente/openstate',
                'X-Title': 'OpenState Auto-Translate'
              },
              body: JSON.stringify({
                model: 'google/gemini-2.0-flash-001',
                messages: [
                  { role: 'system', content: 'You are a professional translator. Translate Portuguese to English accurately while preserving markdown structure, formatting, and technical terms.' },
                  { role: 'user', content: translatePrompt }
                ],
                temperature: 0.3,
                max_tokens: 4000
              })
            });

            if (!response.ok) {
              console.error('Translation API error:', response.status);
              return;
            }

            const data = await response.json();
            const translation = data.choices[0].message.content;

            // Parse the translation
            const titleMatch = translation.match(/---TITLE---\n([\s\S]*?)\n---BODY---/);
            const bodyMatch = translation.match(/---BODY---\n([\s\S]*)/);

            if (!titleMatch || !bodyMatch) {
              console.error('Failed to parse translation response');
              return;
            }

            const translatedTitle = titleMatch[1].trim();
            const translatedBody = bodyMatch[1].trim();

            // Build the comment
            const commentLines = [
              '## 🇬🇧 English Translation',
              '',
              '> This issue was written in Portuguese. Below is an automatic translation for English-speaking readers.',
              '',
              '### ' + translatedTitle,
              '',
              translatedBody,
              '',
              '---',
              '',
              '*This translation was auto-generated. The original issue above is the authoritative version.*'
            ];

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: commentLines.join('\n')
            });

            // Add translated label
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              labels: ['translated']
            });

            console.log('Translation posted successfully.');
