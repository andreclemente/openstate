name: "💬 Meta / Discussion"
description: "Discuss the project itself — structure, rules, suggestions, questions"
title: "[Meta] "
labels: ["meta"]
body:
  - type: markdown
    attributes:
      value: |
        ## 📋 Meta Discussion

        Use this template to discuss the **project itself** — its structure, rules, suggestions, or questions.

        Escreve na tua língua (PT ou EN). Se não estiver em inglês, uma tradução automática será adicionada.

        Write in your language (PT or EN). If not in English, an auto-translation will be added.

  - type: dropdown
    id: tipo
    attributes:
      label: "Tipo / Type"
      options:
        - "Sugestão para o projeto / Project suggestion"
        - "Pergunta sobre o projeto / Question about the project"
        - "Proposta de mudança / Change proposal"
        - "Outro / Other"
    validations:
      required: true

  - type: textarea
    id: descricao
    attributes:
      label: "Descrição / Description"
      description: "Descreve a tua questão, sugestão ou proposta / Describe your question, suggestion, or proposal"
      placeholder: "Ex: Proponho adicionar um novo label para questões de acessibilidade..."
    validations:
      required: true

  - type: textarea
    id: contexto
    attributes:
      label: "Contexto adicional / Additional context"
      description: "Qualquer informação relevante / Any relevant information"
      render: markdown
    validations:
      required: false
